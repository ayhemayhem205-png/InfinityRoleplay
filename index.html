  <script>
  // ...existing code...
  // فتح النافذة المنبثقة عند الضغط على عنصر القاعدة (يدعم data-image)
  document.querySelectorAll('.rule-item').forEach(item => {
    // افتح النافذة إذا العنصر يملك data-image أو عنوانه "القوانين العامة"
    const imgUrl = item.dataset.image;
    const title = item.querySelector('.title')?.textContent.trim();
    if (imgUrl || title === 'القوانين العامة') {
      item.style.cursor = 'pointer';
      item.addEventListener('click', e => {
        e.preventDefault();
        // استخدم مصدر الصورة من data-image إذا وُجد، وإلا حافظ على المصدر الافتراضي
        if (imgUrl) popupImg.src = imgUrl;
        popup.classList.add('active');
      });
    }
  });

  // إغلاق النافذة عند الضغط خارج الصورة أو على الصورة نفسها
  popup.addEventListener('click', e => {
    if (e.target === popup || e.target === popupImg) {
      popup.classList.remove('active');
    }
  });
  // ...existing code...
  </script>
