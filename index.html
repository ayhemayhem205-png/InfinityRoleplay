<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Roleplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Infinity Roleplay</h1>
        <nav>
            <a href="#home">الرئيسية</a>
            <a href="#characters">الشخصيات</a>
            <a href="#stories">القصص</a>
        </nav>
    </header>
    
    <section id="home">
        <h2>مرحبًا بك في Infinity Roleplay</h2>
        <p>موقع للعب الأدوار والقصص الخيالية. شارك في عالم لا نهائي من الإبداع!</p>
    </section>
    
    <section id="characters">

        <div id="character-list">

    </section>
    
    <section id="stories">
        <h2>القصص</h2>
        <div id="story-list">
            <!-- قصص هنا -->
        </div>
        <button id="add-story">أضف قصة جديدة</button>
    </section>
    
    <footer>
        <p>&copy; 2023 Infinity Roleplay. جميع الحقوق محفوظة.</p>
    </footer>
